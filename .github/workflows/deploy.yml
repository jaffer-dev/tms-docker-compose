name: Deploy Task Management App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy on Private Server
    runs-on: self-hosted   # your self-hosted runner on the server

    steps:
      # Get latest code
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          echo "-----------------------------------------"
          echo "Pulling latest code on server..."
          echo "-----------------------------------------"
          git pull origin main || true

          echo "-----------------------------------------"
          echo "Stopping containers..."
          echo "-----------------------------------------"
          docker-compose down

          echo "-----------------------------------------"
          echo "Building containers (using cache)..."
          echo "-----------------------------------------"
          docker-compose build     # cache-enabled build, FAST

          echo "-----------------------------------------"
          echo "Starting containers..."
          echo "-----------------------------------------"
          docker-compose up -d

          echo "-----------------------------------------"
          echo "Deployment complete!"
          echo "-----------------------------------------"
