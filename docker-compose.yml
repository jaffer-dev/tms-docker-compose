version: "3.3"

services:
  backend:
    build: ./backend
    container_name: backend
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
    restart: always

  frontend:
    build: ./task_management_frontend
    container_name: frontend
    expose:
      - "4173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=https://10.10.5.108:8443/api  # 👈 use https + /api path
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "880:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: always
